<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pac-Man</title>
    <link rel="stylesheet" href="style.css">
<link rel='stylesheet' href='../../galaxy-nav.css'>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global-game.css">
</head>
<body>
    <div class="container">
        <h1>Simple Pac-Man</h1>
        <div class="game-info">
            <span>Score: <span id="score">0</span></span>
            <span>Lives: <span id="lives">3</span></span>
        </div>
        <canvas id="gameCanvas" width="448" height="496"></canvas>
        <div id="message" class="message-overlay" style="display: none;"></div>
        <button id="startButton" class="start-button">Start Game</button>
    </div>

    <script src="script.js"></script>
<script src='../../galaxy-nav.js'></script>
</body>
</html>
