<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Generator</title>
    <link rel="stylesheet" href="styles.css">
<link rel='stylesheet' href='../../galaxy-nav.css'>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global-game.css">
</head>
<body>
    <div class="container">
        <h1>Fractal Generator</h1>

        <div class="controls">
            <label for="fractal-type">Fractal Type:</label>
            <select id="fractal-type">
                <option value="sierpinski-triangle" selected>Sierpinski Triangle</option>
                <option value="sierpinski-carpet">Sierpinski Carpet</option>
                <option value="koch-snowflake">Koch Snowflake</option>
                <option value="fractal-tree">Fractal Tree</option>
                <option value="mandelbrot">Mandelbrot Set</option>
            </select>
            <span><!-- Placeholder --></span>

            <!-- Common Controls -->
            <label for="depth">Recursion Depth:</label>
            <input type="range" id="depth" name="depth" min="0" max="8" value="5">
            <span id="depth-value">5</span>

            <label for="hue">Base Hue:</label>
            <input type="range" id="hue" name="hue" min="0" max="360" value="200">
            <span id="hue-value">200</span>

            <!-- Sierpinski / Carpet / Koch Controls -->
            <div class="control-group" id="vector-controls">
                <label for="stroke">Show Stroke:</label>
                <input type="checkbox" id="stroke" name="stroke" checked>
                <span><!-- Placeholder --></span>
            </div>

             <!-- Tree Controls -->
            <div class="control-group" id="tree-controls" style="display: none;">
                 <label for="tree-angle">Branch Angle (°):</label>
                 <input type="range" id="tree-angle" name="tree-angle" min="5" max="90" value="30">
                 <span id="tree-angle-value">30</span>

                 <label for="tree-scale">Length Ratio:</label>
                 <input type="range" id="tree-scale" name="tree-scale" min="0.5" max="0.9" step="0.01" value="0.7">
                 <span id="tree-scale-value">0.70</span>
            </div>

            <!-- Mandelbrot Controls -->
            <div class="control-group" id="mandelbrot-controls" style="display: none;">
                 <label for="mandelbrot-iterations">Max Iterations:</label>
                 <input type="range" id="mandelbrot-iterations" name="mandelbrot-iterations" min="20" max="500" step="10" value="100">
                 <span id="mandelbrot-iterations-value">100</span>
            </div>


            <button id="generate-btn">Generate</button>
        </div>

        <!-- Display Area: Will contain either SVG or Canvas -->
        <div id="fractal-display">
            <div class="svg-container" id="svg-container">
                 <svg id="fractal-svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 500 500">
                    <!-- SVG Fractals drawn here -->
                 </svg>
            </div>
             <div class="canvas-container" id="canvas-container" style="display: none;">
                <canvas id="fractal-canvas" width="500" height="500"></canvas>
             </div>
        </div>

         <p class="note" id="note">Note: High recursion depths or iterations can be slow.</p>
    </div>

    <script src="script.js"></script>
<script src='../../galaxy-nav.js'></script>
</body>
</html>
