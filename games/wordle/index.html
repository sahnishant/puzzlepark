<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel='stylesheet' href='../../galaxy-nav.css'>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global-game.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Wordle Clone</h1>
            <div class="level-info">Level: <span id="current-level">1</span></div>
        </header>

        <div id="message-area" class="message"></div>

        <div id="game-board">
            <!-- Rows and tiles will be generated by JavaScript -->
        </div>

        <div id="keyboard">
            <!-- Keyboard rows/keys will be generated by JavaScript -->
        </div>

        <div id="scorecard" class="scorecard">
            <h2>Statistics</h2>
            <p>Games Played: <span id="games-played">0</span></p>
            <p>Wins: <span id="wins">0</span></p>
            <p>Win %: <span id="win-percentage">0</span></p>
            <p>Current Streak: <span id="current-streak">0</span></p>
            <p>Max Streak: <span id="max-streak">0</span></p>
            <button id="reset-stats-btn">Reset Stats</button>
            <button id="next-level-btn" class="hidden">Next Level</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src='../../galaxy-nav.js'></script>
</body>
</html>
