<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Word Finder Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Word Finder</h1>
            <div class="game-info">
                <span>Level: <span id="current-level">1</span></span>
                <span>Words Found: <span id="words-found-count">0</span>/<span id="total-words">0</span></span>
            </div>
        </header>

        <main class="game-area">

            <div id="letter-grid" class="grid-container">
                <!-- Grid will be generated by JavaScript -->
            </div>
            <aside id="word-list-container">
                <div id="message-area" class="message"></div>
                <h2>Words to Find:</h2>
                <ul id="word-list">
                    <!-- Word list will be generated by JavaScript -->
                </ul>
            </aside>
        </main>

        <footer>
            <button id="next-level-button" style="display: none;">Next Level</button>
            <button id="restart-level-button">Restart Level</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
