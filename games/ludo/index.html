<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="setup-screen">
        <h1>Ludo Game</h1>
        <label for="player-count">Select Players (1-4):</label>
        <select id="player-count">
            <option value="1">1 Player (vs AI)</option>
            <option value="2">2 Players</option>
            <option value="3">3 Players</option>
            <option value="4" selected>4 Players</option>
        </select>
        <button id="start-game">Start Game</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="ludo-board">
            <!-- Board cells will be generated by JS -->
        </div>

        <div id="controls">
            <div id="player-info">
                Current Player: <span id="current-player-color"></span>
                (<span id="current-player-name"></span>)
            </div>
            <div id="dice-area">
                <div id="dice">?</div>
                <button id="roll-dice-btn">Roll Dice</button>
            </div>
            <div id="message-area">
                Roll the dice!
            </div>
            <button id="reset-game-btn" style="margin-top: 10px;">New Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
