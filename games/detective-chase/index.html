<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Chase</title>
    <link rel="stylesheet" href="style.css">
<link rel='stylesheet' href='../../galaxy-nav.css'>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../global-game.css">
</head>
<body>
    <div id="game-container">
        <h1>Detective Chase: The Serpent's Eye</h1>
        <div id="game-output">
            <!-- Game text log will appear here -->
        </div>
        <!-- Add a dedicated div for animations -->
        <div id="animation-output"></div>
        <div id="input-area">
            <label for="user-input">Your Action/Destination:</label>
            <input type="text" id="user-input" placeholder="e.g., Paris or Hint">
            <button id="submit-button">Submit</button>
            <button id="hint-button">Get Hint</button>
            <button id="reset-button">Reset Game</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src='../../galaxy-nav.js'></script>
</body>
</html>
