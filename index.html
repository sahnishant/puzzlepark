<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whimsy Game Galaxy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
</head>
<body>
  <nav class="navigation">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="icon gamepad-icon"></span>
        <span class="logo-text">Whimsy Game Galaxy</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Games</a>
        <a href="https://github.com/yourusername/whimsy-game-galaxy" class="nav-link">GitHub</a>
      </div>
    </div>
  </nav>

  <div class="container main">
    <div class="header">
      <h1 class="title">Whimsy Game Galaxy</h1>
      <p class="subtitle">
        Your fun-filled arcade of games! Click on any game to start playing.
      </p>
    </div>

    <div class="controls">
      <div class="search-container">
        <input type="search" id="searchInput" placeholder="Search games...">
      </div>
      
      <div class="category-filters">
        <button class="filter-btn active" data-category="all">All Games</button>
        <button class="filter-btn" data-category="puzzle">Puzzle Games</button>
        <button class="filter-btn" data-category="arcade">Arcade Games</button>
        <button class="filter-btn" data-category="board">Board Games</button>
        <button class="filter-btn" data-category="word">Word Games</button>
        <button class="filter-btn" data-category="strategy">Strategy Games</button>
      </div>
    </div>

    <div class="games-container">
      <div id="gamesGrid" class="games-grid">
        <!-- Games will be inserted here by JavaScript -->
      </div>
      <div id="noGamesMessage" class="no-games-message hidden">
        <p>No games found matching your search.</p>
      </div>
    </div>

    <footer>
      <p>© <span id="currentYear"></span> Whimsy Game Galaxy. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
